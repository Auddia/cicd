name: '[Action Test] setup_gcloud'

on:
  workflow_dispatch:
    inputs:
      gcp_secret:
        description: 'GCP Secret (JSON key - optional if using WIF)'
        required: false
        default: ''
      workload_identity_provider:
        description: 'Workload Identity Provider resource name'
        required: false
        default: 'projects/156247944579/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
      service_account:
        description: 'Service Account email for WIF'
        required: false
        default: 'github-actions-deploy@cfr-projects-staging.iam.gserviceaccount.com'

jobs:
  gcloud_wif_auth:
    name: 'GCloud Setup via WIF (Keyless)'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: ${{ github.event.inputs.workload_identity_provider != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 'GCloud SDK Setup via WIF'
        id: gcp
        uses: ./actions/setup_gcloud
        with:
          workload_identity_provider: ${{ github.event.inputs.workload_identity_provider }}
          service_account: ${{ github.event.inputs.service_account }}

      - name: 'Test SDK'
        shell: bash
        run: gcloud info

  gcloud_no_secrets:
    name: 'GCloud Setup'
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.gcp_secret != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 'GCloud SDK Setup'
        id: gcp
        uses: ./actions/setup_gcloud
        with:
          gcp_credentials: ${{ github.event.inputs.gcp_secret }}

      - name: 'Test SDK'
        shell: bash
        run: gcloud info

      - name: 'Test Has Sercets'
        shell: bash
        run: |
          source ./scripts/test_functions.sh

          has_secrets=${{ steps.gcp.outputs.has_secrets }}
          strings_equal $has_secrets "false"

  gcloud_with_secrets:
    name: 'GCloud Setup w/ Secrets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 'GCloud SDK Setup'
        id: gcp
        uses: ./actions/setup_gcloud
        with:
          gcp_credentials: ${{ github.event.inputs.gcp_secret }}
          gcp_secrets: |
            TEST_ONE: projects/vodacast-staging/secrets/vodacast-postgres-password
            TEST_TWO: projects/vodacast-staging/secrets/vodacast-postgres-password

      - name: 'Test SDK'
        shell: bash
        run: gcloud info

      - name: 'Test Secrets Avaiablity'
        shell: bash
        run: |
          source ./scripts/test_functions.sh

          has_secrets=${{ steps.gcp.outputs.has_secrets }}
          strings_equal $has_secrets "true"

          secrets=${{ toJson(steps.gcp.outputs.secrets) }}
          strings_unequal $secrets "{}"

          test_one=${{ fromJson(steps.gcp.outputs.secrets).TEST_ONE }}
          test_two=${{ fromJson(steps.gcp.outputs.secrets)['TEST_TWO'] }}

          fail_if_empty_string "$test_one"
          fail_if_empty_string "$test_two"
